{% extends 'base.html' %}

{% block title %}
Add Student
{% endblock %}

{% block content %}

<h2 class="mb-4">Add Student</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">Student Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">Age</label>

<input
type="number"
name="age"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">Course</label>

<input
type="text"
name="course"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">Marks</label>

<input
type="number"
step="0.01"
name="marks"
class="form-control"
required>

</div>

<button
class="btn btn-success">

Save Student

</button>

<a
href="/"
class="btn btn-secondary">

Cancel

</a>

</form>

{% endblock %}
