{% extends "base.html" %}

{% block title %}Edit Student{% endblock %}

{% block content %}

<h2>Edit Student</h2>

<form method="POST">

    <div class="mb-3">
        <label>Name</label>
        <input type="text"
               name="name"
               class="form-control"
               value="{{ student.name }}"
               required>
    </div>

    <div class="mb-3">
        <label>Age</label>
        <input type="number"
               name="age"
               class="form-control"
               value="{{ student.age }}"
               required>
    </div>

    <div class="mb-3">
        <label>Course</label>
        <input type="text"
               name="course"
               class="form-control"
               value="{{ student.course }}"
               required>
    </div>

    <div class="mb-3">
        <label>Marks</label>
        <input type="number"
               step="0.01"
               name="marks"
               class="form-control"
               value="{{ student.marks }}"
               required>
    </div>

    <button class="btn btn-primary">
        Update Student
    </button>

    <a href="/students" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
